spring:
  application:
    name: spring-launch-monitor
  datasource:
    url: jdbc:mysql://localhost:3306/mysqldb
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

launch:
  monitor:
    enable: true
    report: true
    flame: true
    locale: auto
